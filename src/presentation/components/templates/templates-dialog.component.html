<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  [showHeader]="false"
  styleClass="templates-dialog"
  [style]="{ width: '920px', maxWidth: '95vw' }"
>
  <div class="templates-dialog__header">
    <div class="templates-dialog__heading">
      <svg class="templates-dialog__icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="13" y="5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="4" y="14" width="7" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="13" y="14" width="7" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <div>
        <h2 class="templates-dialog__title">Select a template</h2>
        <p class="templates-dialog__subtitle">Choose a template to start creating your card.</p>
      </div>
    </div>
    <button type="button" class="templates-dialog__close" aria-label="Close" (click)="close()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="templates-dialog__filters">
    @for (category of categories; track category.id) {
      <button
        type="button"
        class="filter-chip"
        [class.is-active]="activeCategory === category.id"
        (click)="selectCategory(category.id)"
      >
        @switch (category.id) {
          @case ('birthday') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 6v12M8 10h8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="6" y="8" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          }
          @case ('thank-you') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20s-6-4.2-6-9a4 4 0 0 1 7-2.4A4 4 0 0 1 18 11c0 4.8-6 9-6 9z" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          }
          @case ('anniversary') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="9" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="15" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          }
          @case ('graduation') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10l8-4 8 4-8 4-8-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M6 12v4c0 1.2 2.7 2 6 2s6-.8 6-2v-4" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          }
          @case ('christmas') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4l8 14H4L12 4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          }
          @case ('just-because') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <path d="M9 10h.01M15 10h.01M9 14c1.2 1.4 2.4 2 3 2s1.8-.6 3-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          }
        }
        {{ category.label }}
      </button>
    }
  </div>

  <div class="templates-dialog__grid">
    @for (template of filteredTemplates; track template.id) {
      <button type="button" class="template-item" (click)="selectTemplate(template)">
        <span class="template-item__frame">
          <img [src]="template.src" [alt]="template.label" />
        </span>
        <span class="template-item__label">{{ template.label }}</span>
      </button>
    }
  </div>

  <ng-template #footer>
    <div class="templates-dialog__footer">
      <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" (onClick)="close()" />
    </div>
  </ng-template>
</p-dialog>
